[project]
name = "fastapi-boilerplate"
version = "1.0.0"
description = "Modular async FastAPI service with secure auth, PostgreSQL and observability"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "uvicorn-worker>=0.3,<1",
  "gunicorn>=23,<26", "sqlalchemy[asyncio]>=2.0.52,<2.1", "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
  "pyjwt[crypto]>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1", "redis>=5.2,<7",
  "celery[redis]>=5.5,<6", "prometheus-client>=0.21,<1",
  "sentry-sdk[fastapi,celery]>=2.25,<3", "boto3>=1.37,<2",
]
[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8",
  "httpx>=0.28,<1", "asgi-lifespan>=2.1,<3", "ruff>=0.11,<1",
  "mypy>=1.15,<2", "pre-commit>=4,<5", "types-PyYAML",
]
[tool.uv]
package = false
[tool.ruff]
target-version = "py313"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL and Redis"]
[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["app"]
[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*", "prometheus_client.*", "uvicorn_worker"]
ignore_missing_imports = true
