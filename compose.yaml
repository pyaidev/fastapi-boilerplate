name: fastapi-boilerplate
x-app: &app
  image: fastapi-boilerplate-app:local
  build: {context: ., target: runtime}
  env_file: .env
  init: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  stop_grace_period: 40s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  networks: [backend]
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastapi}
      POSTGRES_USER: ${POSTGRES_USER:-fastapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init}
    ports: ["127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    ports: ["127.0.0.1:${LOCAL_REDIS_PORT:-56379}:6379"]
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-8002}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    <<: *app
    command: ["celery", "-A", "app.infrastructure.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--hostname=worker@%h"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.infrastructure.tasks:celery_app inspect ping --destination worker@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
  beat:
    <<: *app
    command: ["celery", "-A", "app.infrastructure.tasks:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_PORT:-8026}:8025"]
    networks: [backend]
  prometheus:
    image: fastapi-boilerplate-prometheus:local
    build: ./monitoring/prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d", "--storage.tsdb.retention.size=2GB"]
    volumes: [prometheus_data:/prometheus]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"]
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
  grafana:
    image: fastapi-boilerplate-grafana:local
    build: ./monitoring/grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run make init}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    networks: [backend]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  test:
    profiles: [test]
    build: {context: ., target: test}
    env_file: .env
    environment: {APP_ENV: test}
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
networks:
  backend:
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
