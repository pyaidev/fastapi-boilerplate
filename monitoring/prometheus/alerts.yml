groups:
  - name: fastapi
    rules:
      - alert: FastAPIDown
        expr: up{job="fastapi"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: FastAPI metrics endpoint is unreachable}
      - alert: FastAPIHighErrorRate
        expr: sum(rate(fastapi_http_requests_total{job="fastapi",status=~"5.."}[5m])) / clamp_min(sum(rate(fastapi_http_requests_total{job="fastapi"}[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: More than 5% of responses are server errors}
      - alert: FastAPIRateLimitSpike
        expr: sum(rate(fastapi_http_requests_total{job="fastapi",status="429"}[5m])) > 1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: FastAPI is rejecting more than one request per second}
